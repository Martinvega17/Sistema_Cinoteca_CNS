<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPICYT · Bitácora de Acceso a Cintoteca</title>
<link rel="icon" href="src/assets/logo-cns.ico">
<!-- Tailwind CSS compilado -->
<link rel="stylesheet" href="css/output.css">
<!-- Estilos personalizados -->
<link rel="stylesheet" href="src/css/styles.css">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- jsPDF: genera los PDF de exportación con las firmas digitales embebidas -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@5.1.4/dist/signature_pad.umd.min.js"></script>
</head>
<body class="min-h-screen">

  <!--
    ESTRUCTURA DE VISTAS (partials/)
    ================================
    Este archivo es solo el "layout": cabecera <head>, los contenedores
    fijos de cada sección, y el <script> que arranca todo. El contenido de
    cada pantalla vive en su propio archivo bajo partials/, y se inyecta en
    tiempo de carga (ver src/js/core/partials.js) dentro del contenedor que
    tiene el atributo data-partial="ruta/al/archivo.html".

    Por qué así: cada partial corresponde 1-a-1 con una pestaña/rol de la
    app (Registrar y Registros son de cualquier usuario; Personal y Admin
    son solo para administrador/responsable institucional — mismo criterio
    que ya separa el JS en src/js/user/ vs src/js/admin/). Si más adelante
    se agrega o reordena una sección, se edita su propio archivo chico en
    vez de buscarlo dentro de un index.html de cientos de líneas.
  -->

  <!-- ===== PANTALLA DE INICIO DE SESIÓN ===== -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center px-6" data-partial="partials/login.html"></div>

  <!-- ===== APP (oculta hasta iniciar sesión) ===== -->
  <div id="appShell" class="hidden">

    <!-- ===== HEADER INSTITUCIONAL ===== -->
    <header class="border-b border-[var(--line)] bg-[var(--bg-panel)]/90 backdrop-blur sticky top-0 z-20" data-partial="partials/header.html"></header>

    <!-- ===== TÍTULO + PESTAÑAS ===== -->
    <div class="max-w-7xl mx-auto px-6 pt-8 pb-2" data-partial="partials/tabs.html"></div>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main class="max-w-7xl mx-auto px-6 pb-16 mt-4">

      <!-- ---------- PESTAÑA: REGISTRAR (cualquier usuario) ---------- -->
      <section id="tabPanel-registrar" class="tab-panel grid grid-cols-1 lg:grid-cols-5 gap-6" data-partial="partials/tab-registrar.html"></section>

      <!-- ---------- PESTAÑA: REGISTROS / histórico (cualquier usuario) ---------- -->
      <section id="tabPanel-registros" class="tab-panel hidden" data-partial="partials/tab-registros.html"></section>

      <!-- ---------- PESTAÑA: PERSONAL (solo administrador/responsable) ---------- -->
      <section id="tabPanel-personal" class="tab-panel hidden" data-partial="partials/tab-personal.html"></section>

      <!-- ---------- PESTAÑA: ADMIN (solo administrador/responsable) ---------- -->
      <section id="tabPanel-admin" class="tab-panel hidden" data-partial="partials/tab-admin.html"></section>
    </main>

    <!-- ===== PIE / NOTAS LEGALES ===== -->
    <footer class="border-t border-[var(--line)] bg-[var(--bg-panel)]/60" data-partial="partials/footer.html"></footer>
  </div>

  <!-- JavaScript modular -->
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
